
set  -g default-terminal "$TERM"
set  -g base-index      0
setw -g pane-base-index 0





set -g status-keys vi
set -g mode-keys   vi



# rebind main key: C-a
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the application" \
  C-a send-prefix




set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       0
set  -g history-limit     10000

# ============================================= #
# Load plugins with Home Manager                #
# --------------------------------------------- #

# tmuxplugin-sensible
# ---------------------

run-shell ~/.local/share/tmux/plugins/tmux-sensible/sensible.tmux

# ============================================= #

# Preserve Gentoo's one-based window numbering and Ctrl-a passthrough.
set -g base-index 1
bind-key C-a send-prefix

# Terminal color capability and pane-border appearance.
set -sg terminal-overrides ",*:RGB"
set -g pane-border-lines simple
set -g pane-border-style fg=black,bright
set -g pane-active-border-style fg=magenta

# Compact transparent status line with dot-shaped windows.
set -g status-style bg=default,fg=black,bright
set -g status-left " "
set -g status-right "#[fg=black,bright]#S"
set -g window-status-format "#[fg=white,dim]●"
set -g window-status-current-format "#[#{?window_zoomed_flag,fg=yellow,fg=magenta},nobold]●"
set -g window-status-current-style "#{?window_zoomed_flag,fg=yellow,fg=magenta,nobold}"
set -g window-status-style fg=white,dim
set -g window-status-bell-style "fg=red,nobold"
set -g renumber-windows on
set -g repeat-time 1000

# Declaratively packaged tms session manager popups.
bind C-o display-popup -E "tms"
bind C-j display-popup -E "tms switch"
bind C-k display-popup -E "tms kill"

# Splits, reload, status visibility, pane resizing, and zoom.
bind | split-window -h
bind _ split-window -v
bind r source-file ~/.config/tmux/tmux.conf
bind C-z set-option -g status
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Vi copy-mode behavior and project selection.
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
bind-key -r f run-shell "tmux neww tmux-sessionizer"
set -gq allow-passthrough on
unbind -T copy-mode-vi MouseDragEnd1Pane

# Send navigation keys into Vim; otherwise move across tmux panes.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Tmux 3.x requires an unquoted, escaped backslash in this key name.
bind-key -n C-\\ if-shell "$is_vim" { send-keys C-\\ } { select-pane -l }
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

# Matching navigation while copy mode is active.
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi C-\\ select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Keep terminal titles synchronized with tmux session and window names.
set-option -g set-titles on
set-option -g set-titles-string "#S / #W"
